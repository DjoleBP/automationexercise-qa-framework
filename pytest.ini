[pytest]
markers =
    smoke: fast happy-path checks covering the most critical flows
    functional: feature-level happy-path coverage
    regression: broader coverage run on a schedule / before release
    negative: invalid input and error-path coverage
    api: tests against the REST API (no browser)
    mobile: UI tests run under mobile device emulation

addopts = -ra --strict-markers
testpaths = tests

# Without this the root logger stays at WARNING and the api_client INFO logs are
# discarded before pytest can attach them to a failing test's report.
log_level = INFO
